name: Initialize Flutter Browser Next Structure

on:
  workflow_dispatch:

jobs:
  scaffold:
    name: Generate Android-Only Flutter Project
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Wipe Old Files (Keep .github)
        run: |
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' -exec rm -rf {} +

      - name: Run Flutter Create (Android Only)
        run: |
          flutter create . --org com.flutterbrowser --project-name flutter_browser_next --platforms=android

      - name: Commit and Push Generated Files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || {
            git commit -m "chore: initialize flutter browser next structure"
            git push origin main
          }
