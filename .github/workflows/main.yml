name: Build Signed Mobile & TV APKs (ARM64 & ARMv7)

on:
  workflow_dispatch:

jobs:
  build-signed-apks:
    name: Build & Sign Split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split Release APKs (ARM64-v8a & ARMv7)
        run: |
          flutter build apk --release --split-per-abi

      - name: Upload Signed APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-browser-apks-arm64-v7a
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
