name: Setup Keystore and Build Android TV APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Generate Keystore, Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }} # Required to push the workflow cleanup change back

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Setup Keystore (Generate or Decode)
        id: keystore_setup
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          INPUT_STORE_PASS: ${{ inputs.keystore_password }}
          INPUT_ALIAS: ${{ inputs.key_alias }}
          INPUT_KEY_PASS: ${{ inputs.key_password }}
        run: |
          EXISTING_SECRETS=$(gh secret list --repo ${{ github.repository }} --json name --jq '.[].name')
          
          if echo "$EXISTING_SECRETS" | grep -q "KEYSTORE_BASE64"; then
            echo "Keystore secrets exist. Decoding from repository secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks
            
            # Pass existing secrets to build env via GITHUB_ENV
            echo "BUILD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "BUILD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "BUILD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "secret_created=false" >> $GITHUB_OUTPUT
          else
            echo "Generating new signing keystore with custom credentials..."
            
            keytool -genkey -v -keystore android/app/release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$INPUT_ALIAS" \
              -storepass "$INPUT_STORE_PASS" \
              -keypass "$INPUT_KEY_PASS" \
              -dname "CN=Flutter Browser Next, O=OpenSource, C=US"

            ENCODED_KEY=$(base64 -w 0 android/app/release-key.jks)

            echo "Uploading generated keystore to repository secrets..."
            echo -n "$ENCODED_KEY" | gh secret set KEYSTORE_BASE64 --repo ${{ github.repository }}
            echo -n "$INPUT_STORE_PASS" | gh secret set KEYSTORE_PASSWORD --repo ${{ github.repository }}
            echo -n "$INPUT_ALIAS" | gh secret set KEY_ALIAS --repo ${{ github.repository }}
            echo -n "$INPUT_KEY_PASS" | gh secret set KEY_PASSWORD --repo ${{ github.repository }}
            
            # Pass input credentials directly to build env for this first run
            echo "BUILD_STORE_PASSWORD=$INPUT_STORE_PASS" >> $GITHUB_ENV
            echo "BUILD_KEY_ALIAS=$INPUT_ALIAS" >> $GITHUB_ENV
            echo "BUILD_KEY_PASSWORD=$INPUT_KEY_PASS" >> $GITHUB_ENV
            echo "secret_created=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract App Version from pubspec.yaml
        id: extract_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build Release APK (armeabi-v7a optimized)
        env:
          KEYSTORE_FILE: "release-key.jks"
          KEYSTORE_PASSWORD: "${{ env.BUILD_STORE_PASSWORD }}"
          KEY_ALIAS: "${{ env.BUILD_KEY_ALIAS }}"
          KEY_PASSWORD: "${{ env.BUILD_KEY_PASSWORD }}"
        run: flutter build apk --release --target-platform android-arm

      - name: Create GitHub Release and Upload APK Asset
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          TAG="v${{ steps.extract_version.outputs.version }}"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          # Check if release already exists to prevent crash
          if gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Release $TAG already exists. Deleting existing release & tag to overwrite..."
            gh release delete "$TAG" --repo ${{ github.repository }} --yes || true
            git push origin --delete "$TAG" || true
          fi

          echo "Creating GitHub Release for tag $TAG..."
          gh release create "$TAG" "$APK_PATH" \
            --repo ${{ github.repository }} \
            --title "Flutter Browser Next $TAG" \
            --notes "Automated Android TV release (armeabi-v7a optimized) for version $TAG." \
            --draft=false \
            --prerelease=false

      - name: Remove Input Dialogue After Successful First Run
        if: steps.keystore_setup.outputs.secret_created == 'true'
        run: |
          echo "First run complete! Removing input dialogue from workflow file..."
          python3 -c '
          path = ".github/workflows/setup_and_build.yml"
          with open(path, "r") as f:
              lines = f.readlines()

          output = []
          skip = False
          for line in lines:
              if "workflow_dispatch:" in line:
                  output.append(line)
                  # Keep workflow_dispatch without inputs block
                  skip = True
                  continue
              if skip and "jobs:" in line:
                  skip = False
              if not skip:
                  output.append(line)

          with open(path, "w") as f:
              f.writelines(output)
          print("Successfully stripped inputs block.")
          '

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.MY_PAT }}@github.com/${{ github.repository }}.git
          git add .github/workflows/setup_and_build.yml
          git commit -m "chore: remove manual input dialogue after initial keystore generation"
          git push
