name: Setup Keystore and Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Store Password for the Keystore'
        required: true
        type: string
        default: 'my_secure_store_password'
      key_alias:
        description: 'Key Alias'
        required: true
        type: string
        default: 'browser-alias'
      key_password:
        description: 'Password for the Specific Key'
        required: true
        type: string
        default: 'my_secure_key_password'

jobs:
  build:
    name: Generate Keystore, Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Check and Auto-Generate Keystore Secrets
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          INPUT_STORE_PASS: ${{ inputs.keystore_password }}
          INPUT_ALIAS: ${{ inputs.key_alias }}
          INPUT_KEY_PASS: ${{ inputs.key_password }}
        run: |
          EXISTING_SECRETS=$(gh secret list --repo ${{ github.repository }} --json name --jq '.[].name')
          
          if echo "$EXISTING_SECRETS" | grep -q "KEYSTORE_BASE64"; then
            echo "Keystore secrets already exist. Skipping generation."
          else
            echo "Generating new signing keystore with custom credentials..."
            
            keytool -genkey -v -keystore auto-release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$INPUT_ALIAS" \
              -storepass "$INPUT_STORE_PASS" \
              -keypass "$INPUT_KEY_PASS" \
              -dname "CN=Flutter Browser Next, O=OpenSource, C=US"

            ENCODED_KEY=$(base64 -w 0 auto-release-key.jks)

            echo "Uploading generated keystore to repository secrets..."
            
            echo "$ENCODED_KEY" | gh secret set KEYSTORE_BASE64 --repo ${{ github.repository }}
            echo "$INPUT_STORE_PASS" | gh secret set KEYSTORE_PASSWORD --repo ${{ github.repository }}
            echo "$INPUT_ALIAS" | gh secret set KEY_ALIAS --repo ${{ github.repository }}
            echo "$INPUT_KEY_PASS" | gh secret set KEY_PASSWORD --repo ${{ github.repository }}
            
            echo "Custom secrets successfully created and saved!"
          fi

      - name: Decode Keystore for Build
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract App Version from pubspec.yaml
        id: extract_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build Release APK
        env:
          KEYSTORE_FILE: "release-key.jks"
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: flutter build apk --release

      - name: Create GitHub Release and Upload APK Asset
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          TAG="v${{ steps.extract_version.outputs.version }}"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          echo "Creating GitHub Release for tag $TAG..."
          gh release create "$TAG" "$APK_PATH" \
            --repo ${{ github.repository }} \
            --title "Flutter Browser Next $TAG" \
            --notes "Automated Android TV release for version $TAG." \
            --draft=false \
            --prerelease=false

      - name: Upload Backup Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-browser-next-apk
          path: build/app/outputs/flutter-apk/app-release.apk
