name: flutter_browser_next
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  permission_handler: ^11.3.0
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.2

  # In-App Update System
  http: ^1.2.0
  path_provider: ^2.1.2
  open_filex: ^4.7.0
  package_info_plus: ^8.3.1
  device_info_plus: ^10.1.0

  # Phone-to-TV Local WebSocket Sync
  shelf: ^1.4.1
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.0
  network_info_plus: ^5.0.0

  # --- Added for Full-Screen QR Pairing ---
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # --- Swapped to file_selector to bypass compileSdk 36 issues ---
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^6.0.0

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true
  
  # --- Properly indented under flutter: ---
  assets:
    - assets/extensions/
